<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg)}body::before{display:none}.f{padding:18px 20px;font-family:var(--font-body);color:var(--text)}</style></head><body><div class="f"><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
<span class="button button--primary">Primary</span>
<span class="button button--primary" style="transform:translateY(-1px);background:var(--accent-strong)">Hover −1px</span>
<span class="card" style="padding:10px 14px;min-height:0;font-size:12.5px">Card</span>
<span class="card" style="padding:10px 14px;min-height:0;font-size:12.5px;transform:translateY(-2px);box-shadow:var(--shadow-strong)">Hover −2px</span>
</div>
<p style="margin:14px 0 0;font-size:12.5px;color:var(--muted);max-width:64ch">One duration (160ms) and one curve (ease). No scale, no bounce, no glow. Decorative motion is dropped entirely under <code>prefers-reduced-motion</code>.</p></div></body></html>
