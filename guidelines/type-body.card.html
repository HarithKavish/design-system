<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg)}body::before{display:none}.f{padding:18px 20px;font-family:var(--font-body);color:var(--text)}</style></head><body><div class="f"><p style="margin:0;font-size:var(--font-size-lead);color:var(--muted);max-width:62ch">Designed independently. Built thoughtfully. Continuously improved.</p>
<p style="margin:10px 0 0;font-size:var(--font-size-md);max-width:68ch">Body copy sits at 1.02rem with a 1.6 line height. The reading measure is 68ch and never wider; leads are capped at 62ch so they read as a single paragraph.</p></div></body></html>
