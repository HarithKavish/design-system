<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="The page field and the three card surfaces" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg)}body::before{display:none}.f{padding:18px 20px;font-family:var(--font-body);color:var(--text)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{width:104px}.s i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border)}.s b{display:block;margin-top:7px;font-size:11px;font-weight:600;letter-spacing:.02em}.s span{display:block;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}</style></head><body><div class="f"><div class="sw">
<div class="s"><i style="background:var(--bg)"></i><b>--bg</b><span>#f4f9fb</span></div>
<div class="s"><i style="background:var(--bg-accent)"></i><b>--bg-accent</b><span>#e4eef2</span></div>
<div class="s"><i style="background:var(--surface)"></i><b>--surface</b><span>#fff / .86</span></div>
<div class="s"><i style="background:var(--surface-strong)"></i><b>--surface-strong</b><span>#ffffff</span></div>
<div class="s"><i style="background:var(--surface-soft)"></i><b>--surface-soft</b><span>#fff / .58</span></div>
<div class="s"><i style="background:var(--header-bg)"></i><b>--header-bg</b><span>#f4f9fb / .84</span></div>
</div></div></body></html>
