<!-- @dsCard group="Spacing" viewport="700x170" name="Container and rhythm" subtitle="One container width; fluid section gaps" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg)}body::before{display:none}.f{padding:18px 20px;font-family:var(--font-body);color:var(--text)}</style></head><body><div class="f"><div style="border:1px dashed var(--border);border-radius:var(--radius-md);padding:10px">
<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:12px;font-size:12.5px">--container: min(1160px, calc(100% - 2rem))</div>
<div style="height:26px"></div>
<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:12px;font-size:12.5px">--section-gap: clamp(3rem, 7vw, 5.25rem)</div>
</div></div></body></html>
