<!-- @dsCard group="Colors" viewport="700x150" name="Accent" subtitle="Deep slate-teal, taken from the HK mark" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg)}body::before{display:none}.f{padding:18px 20px;font-family:var(--font-body);color:var(--text)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{width:104px}.s i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border)}.s b{display:block;margin-top:7px;font-size:11px;font-weight:600;letter-spacing:.02em}.s span{display:block;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}</style></head><body><div class="f"><div class="sw">
<div class="s"><i style="background:var(--accent)"></i><b>--accent</b><span>#123f50</span></div>
<div class="s"><i style="background:var(--accent-strong)"></i><b>--accent-strong</b><span>#081f29</span></div>
<div class="s"><i style="background:var(--pill-bg)"></i><b>--pill-bg</b><span>#123f50 / .08</span></div>
</div>
<p style="margin:14px 0 0;font-size:12.5px;color:var(--muted);max-width:62ch">One accent, used for the primary button, focus rings, links on hover, and the reading-progress hairline. <code>--accent-strong</code> is the hover of the primary button only.</p></div></body></html>
