<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg)}body::before{display:none}.f{padding:18px 20px;font-family:var(--font-body);color:var(--text)}</style></head><body><div class="f"><div style="display:grid;gap:9px;font-size:13px;max-width:70ch">
<div>“Specialized software services.” <span style="color:var(--muted)">— a title, not a pitch</span></div>
<div>“Recent work, not a blog.” <span style="color:var(--muted)">— says what it is by saying what it isn't</span></div>
<div>“No custom forks.” <span style="color:var(--muted)">— three words, one commitment</span></div>
<div style="color:var(--muted)">Never: “Let's build something amazing!”, “🚀 Launch”, “we're excited to announce”.</div>
</div></div></body></html>
