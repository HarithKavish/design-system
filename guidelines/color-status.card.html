<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Three muted states — never signal colours" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg)}body::before{display:none}.f{padding:18px 20px;font-family:var(--font-body);color:var(--text)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{width:104px}.s i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border)}.s b{display:block;margin-top:7px;font-size:11px;font-weight:600;letter-spacing:.02em}.s span{display:block;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}</style></head><body><div class="f"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
<span class="pill pill--live">Live</span><span class="pill pill--progress">In progress</span><span class="pill pill--planned">Planned</span><span class="pill pill--neutral">Announcement</span><span class="pill pill--neutral pill--handle">@archw177</span>
</div>
<div class="sw" style="margin-top:16px">
<div class="s"><i style="background:var(--status-live-fg)"></i><b>live</b><span>#267f57</span></div>
<div class="s"><i style="background:var(--status-progress-fg)"></i><b>progress</b><span>#8b6a31</span></div>
<div class="s"><i style="background:var(--dot-offline)"></i><b>dot offline</b><span>#b4553f</span></div>
</div></div></body></html>
