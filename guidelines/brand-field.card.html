<!-- @dsCard group="Brand" viewport="700x180" name="Page field" subtitle="A radial wash and a 120px grid at 3%" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg)}body::before{display:none}.f{padding:18px 20px;font-family:var(--font-body);color:var(--text)}</style></head><body><div class="f"><div style="position:relative;height:130px;border-radius:var(--radius-card);border:1px solid var(--border);overflow:hidden;background:radial-gradient(circle at top,var(--bg-accent),transparent 42%),var(--bg)">
<div style="position:absolute;inset:0;background-image:linear-gradient(to right,rgba(128,128,128,.06) 1px,transparent 1px),linear-gradient(to bottom,rgba(128,128,128,.06) 1px,transparent 1px);background-size:60px 60px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.38),transparent 80%)"></div>
<p style="position:absolute;left:16px;bottom:12px;margin:0;font-size:12px;color:var(--muted)">Grid shown at 2× density and opacity for legibility here.</p>
</div></div></body></html>
