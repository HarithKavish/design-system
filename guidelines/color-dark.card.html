<!-- @dsCard group="Colors" viewport="700x160" name="Dark mode" subtitle="A full token swap, not a filter" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg)}body::before{display:none}.f{padding:18px 20px;font-family:var(--font-body);color:var(--text)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{width:104px}.s i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border)}.s b{display:block;margin-top:7px;font-size:11px;font-weight:600;letter-spacing:.02em}.s span{display:block;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}</style></head><body><div class="f"><div class="sw">
<div class="s"><i style="background:#0b1014"></i><b>--bg</b><span>#0b1014</span></div>
<div class="s"><i style="background:#121a1f"></i><b>--surface-strong</b><span>#121a1f</span></div>
<div class="s"><i style="background:#eef2f4"></i><b>--text</b><span>#eef2f4</span></div>
<div class="s"><i style="background:#a4afb6"></i><b>--muted</b><span>#a4afb6</span></div>
<div class="s"><i style="background:#cedfe6"></i><b>--accent</b><span>#cedfe6</span></div>
</div>
<p style="margin:14px 0 0;font-size:12.5px;color:var(--muted);max-width:64ch">In dark mode the accent inverts to a pale slate and the primary button becomes light-on-dark. Set <code>:root[data-theme='dark']</code>; nothing else changes.</p></div></body></html>
