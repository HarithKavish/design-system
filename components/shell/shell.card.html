<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>body{margin:0;background:var(--bg)}body::before{display:none}#root{padding:18px 20px}.cardrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}.lbl{margin:0 0 8px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}</style></head><body><div id="root"></div><script type="text/babel">
const { SiteHeader, SiteFooter, Brand, NavLink, ThemeToggle } = window.HarithKavishDesignSystem_ec4107;
const nav=[{label:'Products',href:'#'},{label:'Updates',href:'#'},{label:'About Us',href:'#'},{label:'Contact',href:'#'}];
function Demo(){const [theme,setTheme]=React.useState('light');
React.useEffect(()=>{document.documentElement.dataset.theme=theme;},[theme]);
return <div className="site-shell" style={{minHeight:0}}>
<SiteHeader logoSrc="../../logo.png" navigation={nav} activeLabel="Products" theme={theme} onToggleTheme={()=>setTheme(t=>t==='dark'?'light':'dark')} progress={38}/>
<div style={{padding:'18px 0 22px'}}>
<p className="lbl">Brand · NavLink · ThemeToggle</p>
<div className="cardrow" style={{alignItems:'center'}}><Brand name="Converse" wordmarkOnly href="#"/><NavLink label="Products" href="#" active/><NavLink label="Updates" href="#"/><ThemeToggle theme={theme} onToggle={()=>setTheme(t=>t==='dark'?'light':'dark')}/></div>
</div>
<SiteFooter links={[{label:'Products',href:'#'},{label:'Legal',href:'#'},{label:'Status',href:'#'},{label:'Sign In',href:'#'}]}/>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
