<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}body{background:transparent}body::before{display:none}
.tile{display:flex;width:1280px;height:854px}
.main{flex:0 0 75%;background:#123f50;display:grid;place-items:center}
.main img{width:52%;height:auto;filter:brightness(0) invert(1);opacity:.96}
.strip{flex:1;display:flex;flex-direction:column}
.strip i{flex:1;display:block}
</style></head><body>
<div class="tile">
<div class="main"><img src="logo.png" alt="Harith Kavish"></div>
<div class="strip"><i style="background:#cedfe6"></i><i style="background:#92d3b0"></i><i style="background:#267f57"></i><i style="background:#081f29"></i></div>
</div></body></html>
