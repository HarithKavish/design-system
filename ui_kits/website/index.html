<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Harith Kavish — Website UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script></head><body>
<div id="root"></div>
<script type="text/babel" src="website-screens.jsx"></script>
<script type="text/babel">
const { SiteHeader, SiteFooter } = window.HarithKavishDesignSystem_ec4107;
const data = window.HKSiteData;
const screens = {
  'Home': window.HomeScreen, 'Products': window.ProductsScreen, 'Updates': window.UpdatesScreen,
  'About Us': window.AboutScreen, 'Contact': window.ContactScreen, 'Status': window.StatusScreen,
  'Sign In': window.SignInScreen, 'Legal': window.LegalScreen
};

function App() {
  const [page, setPage] = React.useState('Home');
  const [theme, setTheme] = React.useState('light');
  React.useEffect(() => { document.documentElement.dataset.theme = theme; }, [theme]);
  React.useEffect(() => { window.scrollTo(0, 0); }, [page]);
  const go = (next) => setPage(next);
  const nav = data.navigation.map((label) => ({ label, onClick: () => go(label) }));
  const footer = data.footerLinks.map((label) => ({ label, onClick: () => go(label) }));
  const Screen = screens[page] || window.HomeScreen;
  return (
    <div className="site-shell">
      <SiteHeader logoSrc="../../logo.png" brand={{ ...data.brand, href: '#' }}
                  navigation={nav} activeLabel={page === 'Home' ? undefined : page}
                  theme={theme} onToggleTheme={() => setTheme((t) => (t === 'dark' ? 'light' : 'dark'))} />
      <main className="site-main"><Screen go={go} /></main>
      <SiteFooter links={footer} activeLabel={page === 'Home' ? undefined : page} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
