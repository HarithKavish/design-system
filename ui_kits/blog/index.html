<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Harith Kavish — Blog UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script></head><body>
<div id="root"></div>
<script type="text/babel" src="blog-screens.jsx"></script>
<script type="text/babel">
const { SiteHeader, SiteFooter } = window.HarithKavishDesignSystem_ec4107;

function App() {
  const [view, setView] = React.useState('index');
  const [theme, setTheme] = React.useState('light');
  const [progress, setProgress] = React.useState(0);
  const [activeId, setActiveId] = React.useState('inheritance');
  React.useEffect(() => { document.documentElement.dataset.theme = theme; }, [theme]);
  React.useEffect(() => {
    const onScroll = () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      setProgress(max > 0 ? (window.scrollY / max) * 100 : 0);
      const heads = Array.from(document.querySelectorAll('.prose h2[id], .prose h3[id]'));
      const passed = heads.filter((h) => h.getBoundingClientRect().top < 140);
      if (passed.length) setActiveId(passed[passed.length - 1].id);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, [view]);
  const nav = [
    { label: 'Discover', onClick: () => setView('index') },
    { label: 'Article', onClick: () => setView('article') },
    { label: 'harithkavish.com', href: '#' }
  ];
  return (
    <div className="site-shell">
      <SiteHeader logoSrc="../../logo.png" brand={{ name: 'Blog', descriptor: 'blog.harithkavish.com', href: '#' }}
                  navigation={nav} activeLabel={view === 'article' ? 'Article' : 'Discover'}
                  theme={theme} onToggleTheme={() => setTheme((t) => (t === 'dark' ? 'light' : 'dark'))}
                  progress={view === 'article' ? progress : undefined} />
      <main className="site-main" data-page={view === 'article' ? 'article' : 'index'}>
        {view === 'article'
          ? <window.ArticleScreen onBack={() => setView('index')} activeId={activeId} />
          : <window.DiscoverScreen onOpen={() => setView('article')} />}
      </main>
      <SiteFooter owner="Harith Kavish" links={[{ label: 'Discover', onClick: () => setView('index') }, { label: 'Legal', href: '#' }, { label: 'Status', href: '#' }]} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
